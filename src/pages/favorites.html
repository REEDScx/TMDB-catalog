<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Filmes favoritos salvos localmente no CineStream." />
    <title>Favoritos | CineStream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/home.css" />
  </head>
  <body>
    <div class="app-glow app-glow--one" aria-hidden="true"></div>
    <div class="app-glow app-glow--two" aria-hidden="true"></div>
    <header class="site-header" data-header>
      <a class="brand" href="../../index.html" aria-label="Página inicial CineStream">
        <span class="brand__mark">▶</span>
    <header class="site-header" data-header>
      <a class="brand" href="../../index.html" aria-label="Página inicial CineStream">
        <span class="brand__mark">C</span>
        <span>CineStream</span>
      </a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="../../index.html#popular">Populares</a>
        <a href="../../index.html#top-rated">Melhores</a>
        <a href="favorites.html" aria-current="page">Minha Lista</a>
      </nav>
      <form class="search" role="search" data-search-form>
        <label class="sr-only" for="movie-search">Pesquisar filmes</label>
        <input id="movie-search" data-search-input type="search" placeholder="Buscar filmes, sagas e novidades..." autocomplete="off" />
        <a href="favorites.html" aria-current="page">Favoritos</a>
      </nav>
      <form class="search" role="search" data-search-form>
        <label class="sr-only" for="movie-search">Pesquisar filmes</label>
        <input id="movie-search" data-search-input type="search" placeholder="Buscar filmes..." autocomplete="off" />
        <button type="submit" aria-label="Buscar">⌕</button>
        <div class="search-results" data-search-results aria-live="polite"></div>
      </form>
    </header>

    <main class="favorites-page">
      <section class="page-title">
        <p class="eyebrow">Sua lista</p>
        <h1>Filmes Favoritos</h1>
        <p class="muted">Os favoritos ficam salvos neste navegador usando LocalStorage.</p>
      </section>
      <section class="movie-grid" data-favorites-grid aria-live="polite"></section>
    </main>

    <button class="back-to-top" data-back-to-top aria-label="Voltar ao topo">↑</button>
    <script type="module" src="../js/favorites.js"></script>
  </body>
